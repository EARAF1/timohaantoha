<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тимоха vs Антон — Kabluk Arena</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0710;
    --surface: #161020;
    --text: #f0ecf8;
    --muted: #9a90b0;
    --pink: #ff4d8d;
    --purple: #a855f7;
    --gold: #fbbf24;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #4dabff;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #2a1a3a, #0a0710 60%);
  }

  #game-wrapper { width: 100vw; height: 100vh; position: relative; }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .screen.active { display: flex; }

  /* ---------- MENU ---------- */
  #menu {
    background: radial-gradient(circle at 50% 50%, rgba(255,77,141,0.18), transparent 65%);
    text-align: center;
    overflow-y: auto;
  }

  #menu h1 {
    font-size: clamp(2rem, 6vw, 3.8rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--pink), var(--gold), var(--purple));
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes shine { to { background-position: 200%; } }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 28px;
    font-style: italic;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .characters {
    display: flex;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .char-card {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 18px;
    width: 220px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
  }
  .char-card:hover {
    border-color: var(--pink);
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(255,77,141,0.3);
  }
  .char-card.selected {
    border-color: var(--pink);
    box-shadow: 0 0 40px rgba(255,77,141,0.6);
    transform: translateY(-4px);
  }

  .char-preview {
    height: 140px;
    margin-bottom: 12px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
    animation: swayChar 3s ease-in-out infinite;
  }
  @keyframes swayChar {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .char-card h3 { font-size: 1.25rem; margin-bottom: 4px; }
  .char-card p { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }

  .difficulty-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .diff-btn {
    background: var(--surface);
    border: 2px solid rgba(255,255,255,0.15);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    font-family: inherit;
    transition: all 0.2s;
  }
  .diff-btn:hover { border-color: var(--purple); }
  .diff-btn.active {
    border-color: var(--pink);
    background: linear-gradient(135deg, rgba(255,77,141,0.25), rgba(168,85,247,0.25));
    box-shadow: 0 0 20px rgba(255,77,141,0.4);
  }

  .start-btn {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff;
    border: none;
    padding: 16px 50px;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 3px;
    border-radius: 60px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,77,141,0.5);
    transition: all 0.2s;
    font-family: inherit;
    text-transform: uppercase;
  }
  .start-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 14px 42px rgba(255,77,141,0.7);
  }
  .start-btn:active { transform: scale(0.97); }

  .controls {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 8px 26px;
    font-size: 0.82rem;
    color: var(--muted);
    justify-content: center;
  }
  .controls b { color: var(--pink); font-weight: 800; }
  .controls b code {
    background: rgba(255,77,141,0.15);
    border: 1px solid rgba(255,77,141,0.4);
    padding: 1px 7px;
    border-radius: 5px;
    font-family: inherit;
  }

  /* ---------- FIGHT ---------- */
  #fight.active {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #fight-stage {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 960 / 540;
    max-height: 100vh;
    background: #000;
    box-shadow: 0 0 80px rgba(255,77,141,0.2);
  }

  #canvas { width: 100%; height: 100%; display: block; }

  #hud {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    z-index: 5;
    pointer-events: none;
  }

  .hp-container { flex: 1; max-width: 380px; }
  .hp-container.right { text-align: right; }

  .hp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }
  .hp-container.right .hp-header { flex-direction: row-reverse; }

  .hp-name {
    font-weight: 800;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }

  .round-dots { display: flex; gap: 5px; }
  .round-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.3s;
  }
  .round-dot.won {
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 12px var(--gold);
  }

  .hp-bar {
    height: 24px;
    background: rgba(0,0,0,0.7);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  .hp-damage {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    background: rgba(255,255,255,0.5);
    transition: width 0.6s ease 0.2s;
    width: 100%;
  }
  .hp-container.right .hp-damage { right: auto; left: 0; }

  .hp-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #22c55e, #10b981);
    transition: width 0.15s ease, background 0.3s;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.3);
  }
  .hp-container.right .hp-fill { left: auto; right: 0; }
  .hp-fill.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .hp-fill.low {
    background: linear-gradient(90deg, #ef4444, #b91c1c);
    animation: pulseRed 0.5s ease-in-out infinite alternate;
  }
  @keyframes pulseRed {
    from { filter: brightness(1); }
    to { filter: brightness(1.5); }
  }

  .charge-bar {
    height: 7px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    margin-top: 5px;
    overflow: hidden;
  }
  .charge-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--gold));
    border-radius: 4px;
    transition: width 0.1s linear;
  }
  .charge-fill.full { animation: pulseCharge 0.6s ease-in-out infinite alternate; }
  @keyframes pulseCharge {
    from { box-shadow: 0 0 8px var(--gold); }
    to { box-shadow: 0 0 24px var(--gold); }
  }

  .timer {
    font-size: 2.2rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px var(--pink), 0 2px 4px rgba(0,0,0,0.9);
    min-width: 70px;
    text-align: center;
    line-height: 1;
    padding-top: 4px;
  }

  #combo {
    position: absolute;
    top: 32%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0) rotate(-8deg);
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(251,191,36,0.9), 0 4px 8px rgba(0,0,0,0.6);
    pointer-events: none;
    opacity: 0;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 6;
    letter-spacing: 2px;
  }
  #combo.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-8deg);
  }

  #announcement {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 40px var(--pink), 0 0 20px var(--pink), 0 6px 12px rgba(0,0,0,0.8);
    pointer-events: none;
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 8;
    letter-spacing: 4px;
    text-align: center;
    white-space: nowrap;
  }
  #announcement.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #hit-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.15s;
    box-shadow: inset 0 0 120px rgba(255,20,80,0.8);
  }
  #hit-vignette.show { opacity: 1; }

  /* ---------- PAUSE / END ---------- */
  #pause, #end {
    background: rgba(10, 7, 16, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    text-align: center;
    z-index: 30;
  }

  #pause h2, #end h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    margin-bottom: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #end h1 {
    background: linear-gradient(135deg, var(--gold), var(--pink));
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  #end p {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 32px;
  }

  .menu-btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }

  .menu-btn {
    background: var(--surface);
    color: var(--text);
    border: 2px solid rgba(255,255,255,0.2);
    padding: 14px 44px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    min-width: 240px;
  }
  .menu-btn:hover {
    border-color: var(--pink);
    background: linear-gradient(135deg, rgba(255,77,141,0.2), rgba(168,85,247,0.2));
    transform: translateY(-2px);
  }
  .menu-btn.primary {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-color: transparent;
  }

  @media (max-width: 700px) {
    .char-card { width: 160px; padding: 12px; }
    .char-preview { height: 100px; font-size: 3.5rem; }
    .controls { grid-template-columns: 1fr 1fr; font-size: 0.75rem; }
    .timer { font-size: 1.6rem; min-width: 50px; }
    .hp-name { font-size: 0.8rem; }
    .hp-bar { height: 18px; }
    .round-dot { width: 9px; height: 9px; }
    .menu-btn { padding: 12px 32px; min-width: 200px; font-size: 0.92rem; }
  }
</style>
</head>
<body>

<div id="game-wrapper">

  <!-- MENU -->
  <div id="menu" class="screen active">
    <h1>Тимоха vs Антон</h1>
    <p class="subtitle">Файтинг века — жир против качка</p>

    <div class="section-label">Выбери бойца</div>
    <div class="characters">
      <div class="char-card" data-char="fat" onclick="selectChar('fat')">
        <div class="char-preview">🐷</div>
        <h3>Тимоха</h3>
        <p>Жирный, мощный, неповоротливый. Бьёт больно.</p>
      </div>
      <div class="char-card" data-char="muscle" onclick="selectChar('muscle')">
        <div class="char-preview">💪</div>
        <h3>Антон</h3>
        <p>Качок. Быстрый, ловкий, сокрушительные удары.</p>
      </div>
    </div>

    <div class="section-label">Сложность</div>
    <div class="difficulty-row">
      <button class="diff-btn" data-diff="easy" onclick="selectDiff('easy')">😌 Легко</button>
      <button class="diff-btn active" data-diff="normal" onclick="selectDiff('normal')">⚔️ Нормально</button>
      <button class="diff-btn" data-diff="hard" onclick="selectDiff('hard')">💀 Сложно</button>
    </div>

    <button class="start-btn" onclick="startMatch()">Начать бой</button>

    <div class="controls">
      <div><b><code>A</code>/<code>D</code></b> — двигаться</div>
      <div><b><code>W</code></b> — прыжок</div>
      <div><b><code>S</code></b> — блок</div>
      <div><b><code>J</code></b> — удар</div>
      <div><b><code>K</code></b> — пинок</div>
      <div><b><code>L</code></b> — супер</div>
    </div>
  </div>

  <!-- FIGHT -->
  <div id="fight" class="screen">
    <div id="fight-stage">
      <div id="hud">
        <div class="hp-container left">
          <div class="hp-header">
            <div class="hp-name" id="name1">Тимоха</div>
            <div class="round-dots" id="dots1"></div>
          </div>
          <div class="hp-bar">
            <div class="hp-damage" id="hpDmg1"></div>
            <div class="hp-fill" id="hp1"></div>
          </div>
          <div class="charge-bar"><div class="charge-fill" id="charge1"></div></div>
        </div>
        <div class="timer" id="timer">60</div>
        <div class="hp-container right">
          <div class="hp-header">
            <div class="hp-name" id="name2">Антон</div>
            <div class="round-dots" id="dots2"></div>
          </div>
          <div class="hp-bar">
            <div class="hp-damage" id="hpDmg2"></div>
            <div class="hp-fill" id="hp2"></div>
          </div>
          <div class="charge-bar"><div class="charge-fill" id="charge2"></div></div>
        </div>
      </div>
      <canvas id="canvas" width="960" height="540"></canvas>
      <div id="hit-vignette"></div>
      <div id="announcement"></div>
      <div id="combo"></div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen">
    <h2>⏸ Пауза</h2>
    <div class="menu-btns">
      <button class="menu-btn primary" onclick="resumeGame()">Продолжить</button>
      <button class="menu-btn" onclick="restartMatch()">Заново</button>
      <button class="menu-btn" onclick="quitToMenu()">Выйти в меню</button>
    </div>
  </div>

  <!-- END -->
  <div id="end" class="screen">
    <h1 id="winner">Победа!</h1>
    <p id="endSub"></p>
    <div class="menu-btns">
      <button class="menu-btn primary" onclick="startMatch()">Ещё раз</button>
      <button class="menu-btn" onclick="quitToMenu()">В меню</button>
    </div>
  </div>

</div>

<script>
// ================= CONSTANTS =================
const CANVAS_W = 960, CANVAS_H = 540, GROUND_Y = 480;
const GRAVITY = 1700, MOVE_SPEED = 300, JUMP_VEL = -680;

const DIFFICULTY = {
  easy:   { speed: 0.55, react: 0.55, aggr: 0.35, block: 0.55, spec: 0.25, hpMul: 0.8, dmgMul: 0.7 },
  normal: { speed: 1.0,  react: 0.30, aggr: 0.65, block: 0.30, spec: 0.50, hpMul: 1.0, dmgMul: 1.0 },
  hard:   { speed: 1.25, react: 0.15, aggr: 0.85, block: 0.15, spec: 0.75, hpMul: 1.15, dmgMul: 1.2 }
};

// ================= SETUP =================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type='sine', vol=0.1, slideTo=null) {
  initAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}

const sfx = {
  whoosh: () => tone(340, 0.12, 'sine', 0.06, 110),
  hitLight: () => tone(200, 0.1, 'square', 0.12, 60),
  hitHeavy: () => tone(140, 0.15, 'square', 0.2, 40),
  block: () => tone(500, 0.08, 'triangle', 0.09, 300),
  special: () => tone(600, 0.4, 'sawtooth', 0.15, 100),
  ko: () => tone(400, 0.7, 'sawtooth', 0.22, 30),
  roundStart: () => { tone(500, 0.15, 'sine', 0.1); setTimeout(() => tone(750, 0.2, 'sine', 0.1), 120); },
  fightStart: () => { tone(600, 0.1, 'sine', 0.12); setTimeout(() => tone(900, 0.25, 'sine', 0.14), 80); }
};

// ================= FIGHTER =================
class Fighter {
  constructor(cfg) {
    this.name = cfg.name;
    this.type = cfg.type;
    this.x = cfg.x;
    this.y = GROUND_Y;
    this.facing = cfg.facing;
    this.isAI = cfg.isAI || false;
    this.opponent = null;
    this.maxHp = cfg.maxHp || 100;
    this.hp = this.maxHp;
    this.state = 'idle';
    this.stateTimer = 0;
    this.vx = 0; this.vy = 0;
    this.onGround = true;
    this.blocking = false;
    this.specialCharge = 0;
    this.maxSpecial = 100;
    this.hitFlash = 0;
    this.animT = Math.random() * 100;
    this.aiTimer = 0;
    this.hasHit = false;
    this.attackDur = 0; this.attackDmg = 0; this.attackRange = 0;
    this.width = this.type === 'fat' ? 105 : 82;
    this.height = this.type === 'fat' ? 150 : 180;
    this.dmgMul = cfg.dmgMul || 1;
    this.walkCycle = 0;
  }

  hurtbox() {
    return { x: this.x - this.width/2, y: this.y - this.height, w: this.width, h: this.height };
  }

  hitbox() {
    if (!this.state.startsWith('attack-')) return null;
    const elapsed = this.attackDur - this.stateTimer;
    if (elapsed < this.attackDur * 0.28 || elapsed > this.attackDur * 0.8) return null;
    const r = this.attackRange;
    const x = this.facing === 1 ? this.x + this.width/2 : this.x - this.width/2 - r;
    return { x, y: this.y - this.height * 0.78, w: r, h: 65 };
  }

  attack(kind) {
    if (this.state === 'hit' || this.state === 'ko') return;
    if (this.state.startsWith('attack-')) return;
    if (!this.onGround) return;
    let dur, dmg, range, snd;
    if (kind === 'punch') { dur = 0.26; dmg = 7; range = 72; snd = 'hitLight'; }
    else if (kind === 'kick') { dur = 0.40; dmg = 12; range = 98; snd = 'hitHeavy'; }
    else if (kind === 'special') {
      if (this.specialCharge < this.maxSpecial) return;
      dur = 0.65; dmg = 26; range = 150; snd = 'special';
      this.specialCharge = 0;
    } else return;

    this.state = 'attack-' + kind;
    this.stateTimer = dur;
    this.attackDur = dur;
    this.attackDmg = dmg * this.dmgMul;
    this.attackRange = range;
    this.attackSnd = snd;
    this.hasHit = false;
    this.blocking = false;
    sfx.whoosh();
  }

  takeDamage(dmg, attackerX) {
    if (this.state === 'ko') return;
    const blocked = this.blocking || this.state === 'block';
    const realDmg = blocked ? dmg * 0.2 : dmg;

    this.hp = Math.max(0, this.hp - realDmg);
    this.hitFlash = 0.28;
    const dir = this.x > attackerX ? 1 : -1;
    this.vx = dir * 220;
    if (!blocked) {
      this.state = 'hit';
      this.stateTimer = 0.3;
    }
    if (this.hp <= 0) {
      this.state = 'ko';
      this.stateTimer = 999;
    }
    return { blocked, realDmg };
  }

  update(dt) {
    this.animT += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;

    if (!this.onGround) {
      this.vy += GRAVITY * dt;
      this.y += this.vy * dt;
      if (this.y >= GROUND_Y) { this.y = GROUND_Y; this.vy = 0; this.onGround = true; }
    }

    if (Math.abs(this.vx) > 10) this.walkCycle += dt * 12;

    this.x += this.vx * dt;
    this.vx *= Math.pow(0.0015, dt);
    this.x = Math.max(70, Math.min(CANVAS_W - 70, this.x));

    if (this.stateTimer > 0) {
      this.stateTimer -= dt;
      if (this.stateTimer <= 0 && this.state !== 'ko') {
        this.state = 'idle';
        this.blocking = false;
      }
    }

    if (this.state !== 'ko' && this.specialCharge < this.maxSpecial) {
      this.specialCharge = Math.min(this.maxSpecial, this.specialCharge + 9 * dt);
    }

    // hit detection
    if (this.state.startsWith('attack-') && !this.hasHit && this.opponent) {
      const elapsed = this.attackDur - this.stateTimer;
      if (elapsed > this.attackDur * 0.28 && elapsed < this.attackDur * 0.8) {
        const hb = this.hitbox();
        const hu = this.opponent.hurtbox();
        if (hb && this.opponent.state !== 'ko' && overlap(hb, hu)) {
          const res = this.opponent.takeDamage(this.attackDmg, this.x);
          this.hasHit = true;
          const cx = this.opponent.x;
          const cy = this.opponent.y - this.opponent.height * 0.55;
          spawnParticles(cx, cy, res.blocked ? 4 : this.attackDmg, res.blocked);
          spawnDamageNumber(cx, cy - 30, res.realDmg, res.blocked);
          spawnImpactRing(cx, cy, res.blocked ? '#4dabff' : '#ff4d8d');
          shake(res.blocked ? 4 : Math.min(18, this.attackDmg * 0.9));
          hitStop(res.blocked ? 0.03 : Math.min(0.09, this.attackDmg * 0.006));
          if (!res.blocked) {
            flashVignette();
            sfx[this.attackSnd]();
            if (comboTimer > 0) comboCount++; else comboCount = 1;
            comboTimer = 1.6;
          } else {
            sfx.block();
          }
        }
      }
    }
  }

  draw(ctx) {
    const x = this.x, y = this.y, f = this.facing;
    const bob = this.state === 'idle' ? Math.sin(this.animT * 3) * 2.5 : 0;
    const yb = y + bob;
    const walk = (Math.abs(this.vx) > 30 && this.onGround && !this.state.startsWith('attack-')) ? Math.sin(this.walkCycle) : 0;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 4, this.width * 0.75, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (this.hitFlash > 0) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(this.hitFlash * 60);
    }
    if (this.state === 'ko') {
      ctx.translate(x, y);
      ctx.rotate(f * Math.PI / 2.2);
      ctx.translate(-x, -y);
    }

    if (this.state === 'attack-special') {
      const prog = 1 - this.stateTimer / this.attackDur;
      ctx.save();
      ctx.globalAlpha = 0.55;
      const glowGrad = ctx.createRadialGradient(x, yb - this.height/2, 10, x, yb - this.height/2, 130);
      glowGrad.addColorStop(0, 'rgba(251,191,36,0.9)');
      glowGrad.addColorStop(1, 'rgba(251,191,36,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(x, yb - this.height/2, 130 + Math.sin(prog*15)*15, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    if (this.type === 'fat') this.drawFat(ctx, x, yb, f, walk);
    else this.drawMuscle(ctx, x, yb, f, walk);

    ctx.restore();
  }

  drawFat(ctx, x, y, f, walk) {
    const legSwing = walk * 14;

    // Legs
    ctx.fillStyle = '#1c1c1c';
    ctx.fillRect(x - 32 + legSwing, y - 32, 24, 34);
    ctx.fillRect(x + 8 - legSwing, y - 32, 24, 34);
    // Shoes
    ctx.fillStyle = '#111';
    ctx.fillRect(x - 38 + legSwing, y - 6, 34, 8);
    ctx.fillRect(x + 4 - legSwing, y - 6, 34, 8);

    // Body (blue shirt)
    ctx.fillStyle = '#4a90d9';
    ctx.beginPath();
    ctx.ellipse(x, y - 78, 55, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    const grad = ctx.createRadialGradient(x - 18, y - 90, 5, x, y - 78, 58);
    grad.addColorStop(0, 'rgba(255,255,255,0.35)');
    grad.addColorStop(0.6, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(x, y - 78, 55, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    // Shirt collar
    ctx.fillStyle = '#2d5a8c';
    ctx.beginPath();
    ctx.moveTo(x - 18, y - 132);
    ctx.lineTo(x + 18, y - 132);
    ctx.lineTo(x, y - 116);
    ctx.closePath();
    ctx.fill();

    // Arms
    const armY = y - 95;
    if (this.state === 'attack-punch') {
      const prog = 1 - this.stateTimer / this.attackDur;
      const ext = Math.min(1, prog * 3.2) * 55;
      ctx.fillStyle = '#f5c5a3';
      ctx.fillRect(x + f * 42, armY, f * Math.max(ext, 10), 18);
      ctx.beginPath();
      ctx.arc(x + f * (42 + Math.max(ext, 10)), armY + 9, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - f * 42, armY, -f * 22, 18);
    } else if (this.state === 'attack-kick') {
      const prog = 1 - this.stateTimer / this.attackDur;
      const ext = Math.min(1, prog * 3.2) * 70;
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(x + f * 10, y - 42, f * Math.max(ext, 5), 26);
      ctx.fillStyle = '#111';
      ctx.fillRect(x + f * (10 + Math.max(ext, 5)), y - 42, f * 16, 24);
      ctx.fillStyle = '#f5c5a3';
      ctx.fillRect(x - 58, armY - 8, 20, 16);
      ctx.fillRect(x + 38, armY - 8, 20, 16);
    } else if (this.state === 'attack-special') {
      ctx.fillStyle = '#f5c5a3';
      ctx.fillRect(x - f * 44, armY - 22, f * 28, 18);
      ctx.fillRect(x + f * 16, armY - 22, f * 28, 18);
    } else if (this.blocking || this.state === 'block') {
      ctx.fillStyle = '#f5c5a3';
      ctx.fillRect(x + f * 32, armY - 12, f * 16, 52);
    } else {
      ctx.fillStyle = '#f5c5a3';
      ctx.fillRect(x - 58, armY, 20, 48);
      ctx.fillRect(x + 38, armY, 20, 48);
    }

    // Head
    const hy = y - 150;
    ctx.fillStyle = '#f5c5a3';
    ctx.beginPath();
    ctx.arc(x, hy, 28, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = '#4a2c1a';
    ctx.beginPath();
    ctx.arc(x, hy - 3, 28, Math.PI * 1.02, Math.PI * 1.98);
    ctx.fill();

    // Mustache
    ctx.fillStyle = '#4a2c1a';
    ctx.fillRect(x - 15, hy + 9, 30, 5);

    // Eyes
    ctx.fillStyle = '#000';
    if (this.state === 'ko') {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - 12, hy - 6); ctx.lineTo(x - 4, hy + 2);
      ctx.moveTo(x - 4, hy - 6); ctx.lineTo(x - 12, hy + 2);
      ctx.moveTo(x + 4, hy - 6); ctx.lineTo(x + 12, hy + 2);
      ctx.moveTo(x + 12, hy - 6); ctx.lineTo(x + 4, hy + 2);
      ctx.stroke();
    } else if (this.state === 'hit') {
      ctx.beginPath();
      ctx.arc(x - 8, hy - 2, 3.5, 0, Math.PI * 2);
      ctx.arc(x + 8, hy - 2, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 12, hy - 10); ctx.lineTo(x - 4, hy - 6);
      ctx.moveTo(x + 12, hy - 10); ctx.lineTo(x + 4, hy - 6);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x - 8, hy - 2, 3.5, 0, Math.PI * 2);
      ctx.arc(x + 8, hy - 2, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawMuscle(ctx, x, y, f, walk) {
    const legSwing = walk * 12;

    // Legs
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 30 + legSwing, y - 48, 24, 50);
    ctx.fillRect(x + 6 - legSwing, y - 48, 24, 50);
    ctx.fillStyle = '#0e0e0e';
    ctx.fillRect(x - 36 + legSwing, y - 6, 34, 8);
    ctx.fillRect(x + 2 - legSwing, y - 6, 34, 8);

    // Torso (red tank)
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(x - 44, y - 170);
    ctx.lineTo(x + 44, y - 170);
    ctx.lineTo(x + 30, y - 45);
    ctx.lineTo(x - 30, y - 45);
    ctx.closePath();
    ctx.fill();

    // Pecs
    ctx.fillStyle = '#ef4f5c';
    ctx.beginPath();
    ctx.arc(x - 20, y - 148, 19, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 148, 19, 0, Math.PI * 2);
    ctx.fill();

    // Abs
    ctx.fillStyle = '#b71c2c';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(x - 15, y - 118 + i * 15, 11, 11);
      ctx.fillRect(x + 4, y - 118 + i * 15, 11, 11);
    }

    // Arms
    const armY = y - 158;
    if (this.state === 'attack-punch') {
      const prog = 1 - this.stateTimer / this.attackDur;
      const ext = Math.min(1, prog * 3.2) * 58;
      ctx.fillStyle = '#e8b088';
      ctx.fillRect(x + f * 38, armY + 10, f * Math.max(ext, 10), 24);
      ctx.beginPath();
      ctx.arc(x + f * (38 + Math.max(ext, 10)), armY + 22, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - f * 46, armY + 10, -f * 26, 24);
    } else if (this.state === 'attack-kick') {
      const prog = 1 - this.stateTimer / this.attackDur;
      const ext = Math.min(1, prog * 3.2) * 75;
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x + f * 10, y - 62, f * Math.max(ext, 5), 30);
      ctx.fillStyle = '#0e0e0e';
      ctx.fillRect(x + f * (10 + Math.max(ext, 5)), y - 62, f * 16, 28);
      ctx.fillStyle = '#e8b088';
      ctx.fillRect(x - 58, armY, 22, 42);
      ctx.fillRect(x + 36, armY, 22, 42);
    } else if (this.state === 'attack-special') {
      ctx.fillStyle = '#e8b088';
      ctx.fillRect(x - f * 46, armY - 32, f * 32, 22);
      ctx.fillRect(x + f * 14, armY - 32, f * 32, 22);
    } else if (this.blocking || this.state === 'block') {
      ctx.fillStyle = '#e8b088';
      ctx.fillRect(x + f * 30, armY + 4, f * 22, 58);
    } else {
      ctx.fillStyle = '#e8b088';
      ctx.fillRect(x - 62, armY, 22, 58);
      ctx.fillRect(x + 40, armY, 22, 58);
      ctx.beginPath();
      ctx.arc(x - 51, armY + 15, 15, 0, Math.PI * 2);
      ctx.arc(x + 51, armY + 15, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    // Head
    const hy = y - 200;
    ctx.fillStyle = '#e8b088';
    ctx.beginPath();
    ctx.arc(x, hy, 25, 0, Math.PI * 2);
    ctx.fill();

    // Hair (short)
    ctx.fillStyle = '#2a1a0a';
    ctx.beginPath();
    ctx.arc(x, hy - 4, 25, Math.PI * 1.05, Math.PI * 1.95);
    ctx.fill();

    // Eyebrows (angry)
    ctx.strokeStyle = '#2a1a0a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 14, hy - 8); ctx.lineTo(x - 3, hy - 4);
    ctx.moveTo(x + 14, hy - 8); ctx.lineTo(x + 3, hy - 4);
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#000';
    if (this.state === 'ko') {
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - 11, hy - 5); ctx.lineTo(x - 3, hy + 3);
      ctx.moveTo(x - 3, hy - 5); ctx.lineTo(x - 11, hy + 3);
      ctx.moveTo(x + 3, hy - 5); ctx.lineTo(x + 11, hy + 3);
      ctx.moveTo(x + 11, hy - 5); ctx.lineTo(x + 3, hy + 3);
      ctx.stroke();
    } else if (this.state === 'hit') {
      ctx.beginPath();
      ctx.arc(x - 7, hy - 1, 3, 0, Math.PI * 2);
      ctx.arc(x + 7, hy - 1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 12, hy - 10); ctx.lineTo(x - 3, hy - 6);
      ctx.moveTo(x + 12, hy - 10); ctx.lineTo(x + 3, hy - 6);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x - 7, hy - 1, 3, 0, Math.PI * 2);
      ctx.arc(x + 7, hy - 1, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Mouth
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (this.state === 'hit' || this.state === 'ko') {
      ctx.arc(x, hy + 13, 6, 0, Math.PI * 2);
    } else if (this.state.startsWith('attack-')) {
      ctx.arc(x, hy + 13, 5, 0, Math.PI);
    } else {
      ctx.moveTo(x - 7, hy + 14);
      ctx.lineTo(x + 7, hy + 14);
    }
    ctx.stroke();
  }
}

// ================= UTILS =================
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ================= STATE =================
let p1 = null, p2 = null;
let gameState = 'menu';
let paused = false;
let difficulty = 'normal';
let selectedChar = 'fat';
let timer = 60;
let round = 1;
let p1Rounds = 0, p2Rounds = 0;
let lastTime = 0;
let shakeAmt = 0;
let hitStop = 0;
let particles = [];
let damageNumbers = [];
let impactRings = [];
let comboCount = 0, comboTimer = 0;
let announceTimer = 0;
let roundActive = false;
let roundEnding = false;
let matchOver = false;
let keys = {};
let bgTime = 0;

const MAX_ROUNDS = 3;

// ================= EFFECTS =================
function shake(amt) { shakeAmt = Math.max(shakeAmt, amt); }
function hitStop(sec) { hitStop = Math.max(hitStop, sec); }

function flashVignette() {
  const v = document.getElementById('hit-vignette');
  v.classList.add('show');
  setTimeout(() => v.classList.remove('show'), 120);
}

function spawnParticles(x, y, dmg, blocked) {
  const n = blocked ? 4 : 8 + Math.min(14, dmg);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 30,
      y: y + (Math.random() - 0.5) * 30,
      vx: (Math.random() - 0.5) * 480,
      vy: (Math.random() - 0.5) * 480 - 120,
      life: 0.5 + Math.random() * 0.35,
      maxLife: 0.85,
      color: blocked ? '#4dabff' : (dmg > 15 ? '#fbbf24' : '#ff4d8d'),
      size: 3 + Math.random() * 6
    });
  }
}

function spawnDamageNumber(x, y, dmg, blocked) {
  damageNumbers.push({
    x, y,
    vy: -90,
    life: 0.9, maxLife: 0.9,
    text: blocked ? 'БЛОК' : Math.round(dmg),
    color: blocked ? '#4dabff' : (dmg > 15 ? '#fbbf24' : '#ff4d8d'),
    size: blocked ? 22 : Math.min(52, 22 + dmg)
  });
}

function spawnImpactRing(x, y, color) {
  impactRings.push({
    x, y, r: 10, maxR: 80, life: 0.35, maxLife: 0.35, color
  });
}

function updateEffects(dt) {
  particles = particles.filter(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 900 * dt; p.vx *= 0.97;
    p.life -= dt;
    return p.life > 0;
  });
  damageNumbers = damageNumbers.filter(d => {
    d.x += 0; d.y += d.vy * dt; d.vy *= 0.94;
    d.life -= dt;
    return d.life > 0;
  });
  impactRings = impactRings.filter(r => {
    r.r += (r.maxR - r.r) * dt * 8;
    r.life -= dt;
    return r.life > 0;
  });
}

function drawEffects() {
  particles.forEach(p => {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  impactRings.forEach(r => {
    const a = Math.max(0, r.life / r.maxLife);
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3;
    ctx.shadowColor = r.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
  damageNumbers.forEach(d => {
    const a = Math.max(0, d.life / d.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `900 ${d.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = d.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.strokeText(d.text, d.x, d.y);
    ctx.fillText(d.text, d.x, d.y);
    ctx.restore();
  });
}

// ================= BACKGROUND =================
function drawBackground() {
  // Sky
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#1a0a2a');
  g.addColorStop(0.5, '#2a1545');
  g.addColorStop(1, '#3d1f5c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CANVAS_W, GROUND_Y);

  // Distant buildings silhouettes
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let i = 0; i < 14; i++) {
    const bx = i * 75 - 20;
    const bh = 80 + Math.sin(i * 2.3) * 60 + (i % 3) * 40;
    ctx.fillRect(bx, GROUND_Y - bh - 40, 65, bh + 40);
    // Windows
    ctx.fillStyle = 'rgba(255,180,80,0.25)';
    for (let wy = GROUND_Y - bh - 30; wy < GROUND_Y - 50; wy += 25) {
      for (let wx = bx + 8; wx < bx + 55; wx += 20) {
        if ((wx + wy + i) % 7 < 3) ctx.fillRect(wx, wy, 8, 12);
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
  }

  // Light rays from top
  ctx.save();
  for (let i = 0; i < 5; i++) {
    const lg = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    lg.addColorStop(0, 'rgba(255,77,141,0.08)');
    lg.addColorStop(1, 'rgba(255,77,141,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(100 + i * 180 + Math.sin(bgTime + i) * 30, 0);
    ctx.lineTo(220 + i * 180 + Math.sin(bgTime + i) * 30, 0);
    ctx.lineTo(340 + i * 180, GROUND_Y);
    ctx.lineTo(0 + i * 180, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Big neon sign
  ctx.save();
  ctx.font = '900 62px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,77,141,0.15)';
  ctx.shadowColor = '#ff4d8d';
  ctx.shadowBlur = 40;
  ctx.fillText('KABLUK ARENA', CANVAS_W / 2, 95);
  ctx.restore();

  // Floor
  const fg = ctx.createLinearGradient(0, GROUND_Y, 0, CANVAS_H);
  fg.addColorStop(0, '#2a1545');
  fg.addColorStop(1, '#08040e');
  ctx.fillStyle = fg;
  ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);

  // Floor grid (perspective)
  ctx.save();
  ctx.strokeStyle = 'rgba(255,77,141,0.2)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    const x = (i / 11) * CANVAS_W;
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(CANVAS_W / 2 + (x - CANVAS_W / 2) * 1.5, CANVAS_H);
    ctx.stroke();
  }
  for (let j = 1; j < 5; j++) {
    const t = j / 5;
    const y = GROUND_Y + (CANVAS_H - GROUND_Y) * (1 - Math.pow(1 - t, 2));
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(CANVAS_W, y);
    ctx.stroke();
  }
  ctx.restore();

  // Ground line glow
  ctx.save();
  ctx.strokeStyle = '#ff4d8d';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff4d8d';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(CANVAS_W, GROUND_Y);
  ctx.stroke();
  ctx.restore();
}

// ================= RENDER =================
function draw() {
  ctx.save();
  if (shakeAmt > 0.5) {
    ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
  }
  drawBackground();
  if (p2) p2.draw(ctx);
  if (p1) p1.draw(ctx);
  drawEffects();
  ctx.restore();
  shakeAmt *= 0.88;
}

// ================= HUD =================
function updateHUD() {
  if (!p1 || !p2) return;
  const hp1 = document.getElementById('hp1');
  const hp2 = document.getElementById('hp2');
  const dmg1 = document.getElementById('hpDmg1');
  const dmg2 = document.getElementById('hpDmg2');
  const ch1 = document.getElementById('charge1');
  const ch2 = document.getElementById('charge2');

  const p1p = (p1.hp / p1.maxHp) * 100;
  const p2p = (p2.hp / p2.maxHp) * 100;

  hp1.style.width = p1p + '%';
  hp2.style.width = p2p + '%';
  dmg1.style.width = p1p + '%';
  dmg2.style.width = p2p + '%';
  hp1.className = 'hp-fill' + (p1p < 25 ? ' low' : p1p < 50 ? ' mid' : '');
  hp2.className = 'hp-fill' + (p2p < 25 ? ' low' : p2p < 50 ? ' mid' : '');

  const c1p = (p1.specialCharge / p1.maxSpecial) * 100;
  const c2p = (p2.specialCharge / p2.maxSpecial) * 100;
  ch1.style.width = c1p + '%';
  ch2.style.width = c2p + '%';
  ch1.classList.toggle('full', c1p >= 100);
  ch2.classList.toggle('full', c2p >= 100);

  document.getElementById('timer').textContent = Math.ceil(timer);

  // Round dots
  document.querySelectorAll('#dots1 .round-dot').forEach((d, i) => d.classList.toggle('won', i < p1Rounds));
  document.querySelectorAll('#dots2 .round-dot').forEach((d, i) => d.classList.toggle('won', i < p2Rounds));
}

function setupRoundDots() {
  const need = Math.ceil(MAX_ROUNDS / 2);
  document.getElementById('dots1').innerHTML = Array(need).fill(0).map(() => '<div class="round-dot"></div>').join('');
  document.getElementById('dots2').innerHTML = Array(need).fill(0).map(() => '<div class="round-dot"></div>').join('');
}

function showAnnouncement(text, dur) {
  const el = document.getElementById('announcement');
  el.textContent = text;
  el.classList.add('visible');
  announceTimer = dur;
}

// ================= AI =================
function updateAI(ai, dt) {
  if (ai.state === 'ko' || ai.state === 'hit' || !roundActive) return;
  const diff = DIFFICULTY[difficulty];
  ai.facing = ai.opponent.x > ai.x ? 1 : -1;
  if (ai.state.startsWith('attack-')) return;

  ai.aiTimer = (ai.aiTimer || 0) - dt;
  if (ai.aiTimer > 0) return;

  const dist = Math.abs(ai.x - ai.opponent.x);
  const hpRatio = ai.hp / ai.maxHp;
  const oppHpRatio = ai.opponent.hp / ai.opponent.maxHp;
  const aggr = diff.aggr * (hpRatio > 0.5 ? 1 : 1.2);

  ai.aiTimer = diff.react + Math.random() * diff.react;

  if (dist > 220) {
    ai.vx = ai.facing * MOVE_SPEED * diff.speed * 0.9;
  } else if (dist > 110) {
    const r = Math.random();
    if (ai.specialCharge >= ai.maxSpecial && r < diff.spec * 0.5) {
      ai.attack('special');
    } else if (r < aggr * 0.5) {
      ai.vx = ai.facing * MOVE_SPEED * diff.speed * 0.85;
    } else if (r < aggr * 0.75) {
      ai.attack('kick');
    } else if (r < diff.block) {
      ai.blocking = true; ai.state = 'block'; ai.stateTimer = 0.35;
    } else {
      ai.vx = -ai.facing * MOVE_SPEED * diff.speed * 0.5;
    }
  } else {
    const r = Math.random();
    if (ai.specialCharge >= ai.maxSpecial && r < diff.spec) {
      ai.attack('special');
    } else if (r < 0.32) {
      ai.attack('punch');
    } else if (r < 0.62) {
      ai.attack('kick');
    } else if (r < diff.block) {
      ai.blocking = true; ai.state = 'block'; ai.stateTimer = 0.3;
    } else {
      ai.vx = -ai.facing * MOVE_SPEED * diff.speed * 0.6;
    }
  }

  // occasional jump
  if (ai.onGround && Math.random() < 0.02 * diff.speed && dist < 200) {
    ai.vy = JUMP_VEL; ai.onGround = false;
  }
}

// ================= INPUT =================
document.addEventListener('keydown', e => {
  const code = e.code;

  if (code === 'KeyA' || code === 'ArrowLeft') keys.a = true;
  if (code === 'KeyD' || code === 'ArrowRight') keys.d = true;
  if (code === 'KeyW' || code === 'ArrowUp') keys.w = true;
  if (code === 'KeyS' || code === 'ArrowDown') keys.s = true;
  if (code === 'KeyJ') keys.j = true;
  if (code === 'KeyK') keys.k = true;
  if (code === 'KeyL') keys.l = true;

  // Pause
  if ((code === 'Escape' || code === 'KeyP') && gameState === 'fight') {
    if (paused) resumeGame(); else pauseGame();
    return;
  }

  if (gameState !== 'fight' || !p1 || paused) return;
  if (!roundActive) return;
  if (p1.state === 'ko' || p1.state === 'hit') return;

  if (code === 'KeyJ') p1.attack('punch');
  else if (code === 'KeyK') p1.attack('kick');
  else if (code === 'KeyL') p1.attack('special');
  else if ((code === 'KeyW' || code === 'ArrowUp') && p1.onGround && !p1.state.startsWith('attack-')) {
    p1.vy = JUMP_VEL; p1.onGround = false;
  }
});

document.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'KeyA' || c === 'ArrowLeft') keys.a = false;
  if (c === 'KeyD' || c === 'ArrowRight') keys.d = false;
  if (c === 'KeyW' || c === 'ArrowUp') keys.w = false;
  if (c === 'KeyS' || c === 'ArrowDown') keys.s = false;
  if (c === 'KeyJ') keys.j = false;
  if (c === 'KeyK') keys.k = false;
  if (c === 'KeyL') keys.l = false;
});

window.addEventListener('blur', () => {
  keys = {};
});

function updateInput() {
  if (!p1 || p1.state === 'ko' || !roundActive || paused) return;
  if (p1.state.startsWith('attack-') || p1.state === 'hit') return;

  const left = keys.a, right = keys.d;
  const blocking = keys.s && p1.onGround;

  if (left) { p1.vx = -MOVE_SPEED; p1.facing = -1; }
  else if (right) { p1.vx = MOVE_SPEED; p1.facing = 1; }

  p1.blocking = blocking;
  if (blocking) p1.state = 'block';
  else if (p1.state === 'block') p1.state = 'idle';
}

// ================= GAME FLOW =================
function selectChar(type) {
  selectedChar = type;
  document.querySelectorAll('.char-card').forEach(c => c.classList.toggle('selected', c.dataset.char === type));
}

function selectDiff(d) {
  difficulty = d;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === d));
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startMatch() {
  initAudio();
  p1Rounds = 0; p2Rounds = 0; round = 1; matchOver = false;
  createFighters();
  setupRoundDots();
  showScreen('fight');
  gameState = 'fight';
  paused = false;
  startRound();
}

function createFighters() {
  const diff = DIFFICULTY[difficulty];
  const isFatPlayer = selectedChar === 'fat';

  if (isFatPlayer) {
    p1 = new Fighter({ name: 'Тимоха', type: 'fat', x: 280, facing: 1, isAI: false });
    p2 = new Fighter({ name: 'Антон', type: 'muscle', x: 680, facing: -1, isAI: true, maxHp: Math.round(100 * diff.hpMul), dmgMul: diff.dmgMul });
  } else {
    p1 = new Fighter({ name: 'Антон', type: 'muscle', x: 280, facing: 1, isAI: false });
    p2 = new Fighter({ name: 'Тимоха', type: 'fat', x: 680, facing: -1, isAI: true, maxHp: Math.round(100 * diff.hpMul), dmgMul: diff.dmgMul });
  }
  p1.opponent = p2;
  p2.opponent = p1;
  document.getElementById('name1').textContent = p1.name;
  document.getElementById('name2').textContent = p2.name;
}

function startRound() {
  // Reset fighters (keep names, types; reset hp/pos/state)
  const diff = DIFFICULTY[difficulty];
  const isFatPlayer = selectedChar === 'fat';
  if (isFatPlayer) {
    p1 = new Fighter({ name: 'Тимоха', type: 'fat', x: 280, facing: 1, isAI: false });
    p2 = new Fighter({ name: 'Антон', type: 'muscle', x: 680, facing: -1, isAI: true, maxHp: Math.round(100 * diff.hpMul), dmgMul: diff.dmgMul });
  } else {
    p1 = new Fighter({ name: 'Антон', type: 'muscle', x: 280, facing: 1, isAI: false });
    p2 = new Fighter({ name: 'Тимоха', type: 'fat', x: 680, facing: -1, isAI: true, maxHp: Math.round(100 * diff.hpMul), dmgMul: diff.dmgMul });
  }
  p1.opponent = p2; p2.opponent = p1;

  timer = 60;
  roundActive = false;
  roundEnding = false;
  particles = []; damageNumbers = []; impactRings = [];
  comboCount = 0; comboTimer = 0;
  shakeAmt = 0; hitStop = 0;

  updateHUD();
  showAnnouncement('РАУНД ' + round, 1.3);
  sfx.roundStart();

  setTimeout(() => {
    if (gameState !== 'fight' || paused) return;
    showAnnouncement('БОЙ!', 0.7);
    sfx.fightStart();
    roundActive = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }, 1400);
}

function endRound(winner) { // 'p1' | 'p2' | 'draw'
  if (roundEnding || matchOver) return;
  roundEnding = true;
  roundActive = false;

  if (winner === 'p1') p1Rounds++;
  else if (winner === 'p2') p2Rounds++;

  updateHUD();

  if (p1Rounds >= 2 || p2Rounds >= 2) {
    showAnnouncement(winner === 'p1' ? 'ПОБЕДА!' : 'ПОРАЖЕНИЕ', 1.5);
    matchOver = true;
    setTimeout(showEndScreen, 1800);
  } else {
    showAnnouncement('РАУНД ' + (winner === 'p1' ? 'ТВОЙ' : winner === 'p2' ? 'ПРОТИВНИКА' : 'НИЧЬЯ'), 1.3);
    round++;
    setTimeout(() => {
      if (gameState === 'fight') startRound();
    }, 1600);
  }
}

function showEndScreen() {
  gameState = 'end';
  const win = p1Rounds > p2Rounds;
  document.getElementById('winner').textContent = win ? '🏆 ПОБЕДА!' : '💀 ПОРАЖЕНИЕ';
  document.getElementById('endSub').textContent = win
    ? `${p1.name} побеждает со счётом ${p1Rounds}:${p2Rounds}`
    : `${p2.name} побеждает со счётом ${p2Rounds}:${p1Rounds}`;
  showScreen('end');
}

function pauseGame() {
  if (gameState !== 'fight' || !roundActive) return;
  paused = true;
  showScreen('pause');
}

function resumeGame() {
  if (!paused) return;
  paused = false;
  showScreen('fight');
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function restartMatch() {
  paused = false;
  startMatch();
}

function quitToMenu() {
  paused = false;
  gameState = 'menu';
  matchOver = false;
  p1 = null; p2 = null;
  particles = []; damageNumbers = []; impactRings = [];
  showScreen('menu');
}

// ================= LOOP =================
function loop(now) {
  if (gameState !== 'fight' || paused) return;

  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  bgTime += dt;

  // Announcement timer
  if (announceTimer > 0) {
    announceTimer -= dt;
    if (announceTimer <= 0) {
      document.getElementById('announcement').classList.remove('visible');
    }
  }

  // Hit stop
  if (hitStop > 0) {
    hitStop -= dt;
    draw();
    requestAnimationFrame(loop);
    return;
  }

  if (roundActive && !roundEnding) {
    timer -= dt;
    if (timer <= 0) {
      timer = 0;
      // Determine by HP
      if (p1.hp > p2.hp) endRound('p1');
      else if (p2.hp > p1.hp) endRound('p2');
      else endRound('draw');
    }

    updateInput();
    if (p2.isAI) updateAI(p2, dt);
  }

  if (p1) p1.update(dt);
  if (p2) p2.update(dt);

  // Collision
  if (p1 && p2) {
    const d = p2.x - p1.x;
    if (Math.abs(d) < 85) {
      const ov = 85 - Math.abs(d);
      const dir = d > 0 ? 1 : -1;
      p1.x -= dir * ov / 2;
      p2.x += dir * ov / 2;
      p1.x = clamp(p1.x, 70, CANVAS_W - 70);
      p2.x = clamp(p2.x, 70, CANVAS_W - 70);
    }
  }

  updateEffects(dt);

  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }
  const cEl = document.getElementById('combo');
  if (comboCount > 1 && comboTimer > 0) {
    cEl.textContent = comboCount + 'x COMBO';
    cEl.classList.add('visible');
  } else {
    cEl.classList.remove('visible');
  }

  // KO check
  if (roundActive && !roundEnding) {
    if (p1.hp <= 0) {
      sfx.ko();
      showAnnouncement('K.O.!', 1.5);
      hitStop(0.15);
      shake(25);
      setTimeout(() => endRound('p2'), 1400);
    } else if (p2.hp <= 0) {
      sfx.ko();
      showAnnouncement('K.O.!', 1.5);
      hitStop(0.15);
      shake(25);
      setTimeout(() => endRound('p1'), 1400);
    }
  }

  updateHUD();
  draw();
  requestAnimationFrame(loop);
}

// ================= INIT =================
selectChar('fat');
selectDiff('normal');
</script>
